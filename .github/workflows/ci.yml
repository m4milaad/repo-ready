name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - name: Run the project test suite
        run: python -m pytest -q
      - name: Validate release metadata
        run: python scripts/release_check.py
      - name: Install release tooling
        run: python -m pip install -r requirements-release.lock
      - name: Build and validate release artifacts
        run: python scripts/release_gate.py --skip-docker --skip-browser --output-dir /tmp/repo-ready-release
      - name: Build the wheel
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir /tmp/repo-ready-wheel .
      - name: Install and verify the wheel
        env:
          PYTHONPATH: ''
        run: |
          python -m pip install --no-index --force-reinstall --no-deps /tmp/repo-ready-wheel/*.whl
          python -m pip check
          python -c "from pathlib import Path; import repo_ready; package = Path(repo_ready.__file__).resolve(); assert Path.cwd() / 'src' not in package.parents, package"
          python -m repo_ready --version
          repo-ready --version
      - name: Test the installed wheel
        env:
          PYTHONPATH: ''
          REPO_READY_TEST_NO_SRC: '1'
        run: python -m pytest -q
      - name: Run the showcase smoke gate
        env:
          PYTHONPATH: ''
        run: python scripts/showcase_smoke.py
      - name: Verify the clean Docker image
        run: |
          docker build --pull -t repo-ready-ci .
          docker run --rm --network none repo-ready-ci python -m pytest -q
