name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked test tools
        run: python -m pip install -r requirements.lock
      - name: Run the project test suite
        run: python -m pytest -q
      - name: Validate release metadata
        run: python scripts/release_check.py
      - name: Install locked release tools
        run: python -m pip install -r requirements-release.lock
      - name: Run the artifact and showcase release gate
        run: python scripts/release_gate.py --skip-docker --skip-browser --output-dir release-gate
      - name: Check installed dependencies
        run: python -m pip check

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the pinned clean-room image
        run: docker build --pull -t repo-ready-ci .
      - name: Run the packaged Linux suite offline
        run: docker run --rm --network none repo-ready-ci python -m pytest -q
