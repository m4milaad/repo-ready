name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - name: Build the installed artifact
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir /tmp/repo-ready-wheel .
      - name: Install and test the wheel
        env:
          PYTHONPATH: ''
          REPO_READY_TEST_NO_SRC: '1'
        run: |
          python -m pip install --no-index --force-reinstall --no-deps /tmp/repo-ready-wheel/*.whl
          python -m pip check
          python -c "from pathlib import Path; import repo_ready; package = Path(repo_ready.__file__).resolve(); assert Path.cwd() / 'src' not in package.parents, package"
          python -m repo_ready --version
          repo-ready --version
          python -m pytest -q
