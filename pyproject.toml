[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-ready"
version = "0.1.0"
description = "Offline contributor-readiness and rebuildability scoring for local repositories"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
repo-ready = "repo_ready.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
